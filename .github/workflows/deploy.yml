name: DP Deploy AWS Clients
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: write
env:
  BRANCH_NAME: version-bump-${{ github.run_id }}${{ github.run_attempt }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b # v1.2.1
      - uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.MANAGEMENT_ACCOUNT }}:role/mgmt-library-put-events-role
          aws-region: eu-west-2
          role-session-name: DAAWSClientDeploySendMessage
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          git_user_signingkey: true
          git_commit_gpgsign: true
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - run: |
          git config --global user.email 181243999+tna-da-bot@users.noreply.github.com
          git config --global user.name tna-da-bot
          git checkout -b $BRANCH_NAME
          git remote set-url origin "https://x-access-token:$GH_TOKEN@github.com/nationalarchives/da-aws-clients.git"
          git push -u origin $BRANCH_NAME
          sbt '+release with-defaults'
        env:
          GH_TOKEN: ${{ github.token }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      - name: Create Pull Request
        run: gh pr create --fill --label 'Version bump'
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
      - run: pip install boto3
      - if: failure()
        run: python .github/scripts/send_message.py
        env:
          MESSAGE: ":warning: Build failed for DA AWS clients <https://github.com/nationalarchives/da-aws-clients/actions/runs/${{ github.run_id }}|View the failed workflow>"
      - run: python .github/scripts/send_message.py
        env:
          MESSAGE: ":white_check_mark: da-aws-clients has been published"
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: sbt/setup-sbt@af116cce31c00823d3903ce687f9cda3a4f19f1b # v1.2.1
      - name: Update docs site
        run: |
          sbt 'docs / makeSite'
          git config --global user.email 181243999+tna-da-bot@users.noreply.github.com
          git config --global user.name tna-da-bot
          git checkout gh-pages
          rm -rf docs
          mkdir docs && cp -r site-docs/target/site/* docs
          git add docs | true
          git commit -m "Update site documentation" | true
          git push -u origin gh-pages | true
        env:
          GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
